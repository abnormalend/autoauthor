[project]
# Dev tooling only — this is not the shipped artifact. The plugin and its
# version live in plugin/autoauthor/.claude-plugin/plugin.json, and this
# version is deliberately not kept in step with it.
name = "autoauthor"
version = "0.1.0"
description = "Dev environment for the autoauthor Claude Code plugin: tests and the standalone art/audiobook tools"
requires-python = ">=3.12"
# No runtime dependencies. The plugin's scripts are stdlib-only by design —
# they run inside Claude Code on whatever Python is present, so a third-party
# import would be a silent failure on someone else's machine. httpx and
# python-dotenv were here for the standalone API tools, removed in 0.4.1.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
